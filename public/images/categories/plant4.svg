<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="100%" height="100%">
  <defs>
    <!-- Terracotta / Ceramic Pot Gradient -->
    <linearGradient id="potGrad4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fdf4e3" />
      <stop offset="35%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f5e6d3" />
      <stop offset="100%" stop-color="#e8d5c4" />
    </linearGradient>
    <linearGradient id="stripeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c86d4b" />
      <stop offset="50%" stop-color="#e07a5f" />
      <stop offset="100%" stop-color="#a65233" />
    </linearGradient>
    <linearGradient id="soilGrad4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3d2314" />
      <stop offset="100%" stop-color="#5c3821" />
    </linearGradient>

    <!-- Cactus Body 3D Gradients -->
    <linearGradient id="cactusMain" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2d6a4f" />
      <stop offset="30%" stop-color="#52b788" />
      <stop offset="70%" stop-color="#40916c" />
      <stop offset="100%" stop-color="#1b4332" />
    </linearGradient>
    <linearGradient id="cactusBranch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#74c69d" />
      <stop offset="50%" stop-color="#40916c" />
      <stop offset="100%" stop-color="#1b4332" />
    </linearGradient>

    <filter id="shadow4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="8" flood-color="#000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="150" cy="358" rx="55" ry="10" fill="#000000" opacity="0.12" filter="blur(4px)" />

  <!-- Potted Base (White & Terracotta Accent) -->
  <g filter="url(#shadow4)">
    <path d="M110,300 L190,300 L182,352 Q180,358 150,358 Q120,358 118,352 Z" fill="url(#potGrad4)" />
    <!-- Terracotta Accent Band -->
    <path d="M114,324 L186,324 L184,338 L116,338 Z" fill="url(#stripeGrad)" />
    <ellipse cx="150" cy="300" rx="40" ry="9" fill="url(#potGrad4)" stroke="#e2e8f0" stroke-width="0.5" />
    <ellipse cx="150" cy="300" rx="36" ry="7" fill="url(#soilGrad4)" />
  </g>

  <!-- Main Cactus Trunk -->
  <g filter="url(#shadow4)">
    <rect x="136" y="90" width="28" height="215" rx="14" fill="url(#cactusMain)" />
    <!-- Rib Highlights & Ridges -->
    <line x1="143" y1="98" x2="143" y2="300" stroke="#b7e4c7" stroke-width="1.5" opacity="0.6" />
    <line x1="150" y1="95" x2="150" y2="300" stroke="#d8f3dc" stroke-width="2" opacity="0.8" />
    <line x1="157" y1="98" x2="157" y2="300" stroke="#1b4332" stroke-width="1.5" opacity="0.7" />
  </g>

  <!-- Left Branch -->
  <path d="M136,230 L115,230 Q105,230 105,220 L105,170" fill="none" stroke="url(#cactusBranch)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M136,230 L115,230 Q105,230 105,220 L105,170" fill="none" stroke="#b7e4c7" stroke-width="2" stroke-dasharray="2,6" opacity="0.7" />

  <!-- Right Branch -->
  <path d="M164,195 L185,195 Q195,195 195,185 L195,130" fill="none" stroke="url(#cactusBranch)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M164,195 L185,195 Q195,195 195,185 L195,130" fill="none" stroke="#d8f3dc" stroke-width="2" stroke-dasharray="2,6" opacity="0.7" />

  <!-- Spine / Needle Clusters -->
  <g fill="#fffae0">
    <circle cx="150" cy="115" r="1.5"/><circle cx="150" cy="145" r="1.5"/><circle cx="150" cy="175" r="1.5"/><circle cx="150" cy="205" r="1.5"/><circle cx="150" cy="235" r="1.5"/><circle cx="150" cy="265" r="1.5"/>
    <circle cx="105" cy="180" r="1.5"/><circle cx="105" cy="200" r="1.5"/>
    <circle cx="195" cy="145" r="1.5"/><circle cx="195" cy="165" r="1.5"/><circle cx="195" cy="185" r="1.5"/>
  </g>
</svg>
