<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="100%" height="100%">
  <defs>
    <linearGradient id="potGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="40%" stop-color="#ffffff" />
      <stop offset="80%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="soilGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a1a08" />
      <stop offset="100%" stop-color="#4a3018" />
    </linearGradient>
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="50%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>

    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="8" flood-color="#000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="150" cy="358" rx="55" ry="10" fill="#000000" opacity="0.12" filter="blur(4px)" />

  <!-- Potted Base -->
  <g filter="url(#shadow3)">
    <path d="M110,305 L190,305 L182,352 Q180,358 150,358 Q120,358 118,352 Z" fill="url(#potGrad3)" />
    <ellipse cx="150" cy="305" rx="40" ry="9" fill="url(#potGrad3)" stroke="#cbd5e1" stroke-width="0.5" />
    <ellipse cx="150" cy="305" rx="36" ry="7" fill="url(#soilGrad3)" />
  </g>

  <!-- Main Tall Curved Stem -->
  <path d="M150,305 Q142,200 152,90" fill="none" stroke="url(#stemGrad)" stroke-width="5.5" stroke-linecap="round" />
  
  <!-- Secondary Stems -->
  <path d="M148,220 Q110,165 75,130" fill="none" stroke="url(#stemGrad)" stroke-width="4.5" stroke-linecap="round" />
  <path d="M151,155 Q195,135 238,155" fill="none" stroke="url(#stemGrad)" stroke-width="4" stroke-linecap="round" />

  <!-- Leaf Tips/Blades -->
  <g stroke-linecap="round">
    <path d="M152,90 Q138,65 115,50" fill="none" stroke="#22c55e" stroke-width="3" />
    <path d="M152,90 Q168,68 190,55" fill="none" stroke="#4ade80" stroke-width="3" />
    <path d="M152,90 Q150,60 148,42" fill="none" stroke="#16a34a" stroke-width="3" />

    <path d="M75,130 Q58,112 42,102 M75,130 Q68,105 60,90 M75,130 Q88,110 98,98" fill="none" stroke="#22c55e" stroke-width="2.5" />
    <path d="M238,155 Q255,148 272,150 M238,155 Q250,168 265,178 M238,155 Q248,138 258,128" fill="none" stroke="#4ade80" stroke-width="2.5" />
  </g>
</svg>
