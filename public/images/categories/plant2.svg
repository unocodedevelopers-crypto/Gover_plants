<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="100%" height="100%">
  <defs>
    <!-- Pot Gradient -->
    <linearGradient id="potGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="40%" stop-color="#ffffff" />
      <stop offset="80%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="soilGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a1a08" />
      <stop offset="100%" stop-color="#4a3018" />
    </linearGradient>

    <!-- Broad Leaf Gradients -->
    <linearGradient id="leafGradMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac" />
      <stop offset="30%" stop-color="#22c55e" />
      <stop offset="75%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>
    <linearGradient id="leafGradBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="50%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>

    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="8" flood-color="#000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="150" cy="358" rx="55" ry="10" fill="#000000" opacity="0.12" filter="blur(4px)" />

  <!-- Potted Base -->
  <g filter="url(#shadow2)">
    <path d="M110,305 L190,305 L182,352 Q180,358 150,358 Q120,358 118,352 Z" fill="url(#potGrad2)" />
    <ellipse cx="150" cy="305" rx="40" ry="9" fill="url(#potGrad2)" stroke="#cbd5e1" stroke-width="0.5" />
    <ellipse cx="150" cy="305" rx="36" ry="7" fill="url(#soilGrad2)" />
  </g>

  <!-- Stems -->
  <path d="M150,305 Q145,230 142,145" fill="none" stroke="#15803d" stroke-width="6" stroke-linecap="round" />
  <path d="M150,305 Q165,230 195,150" fill="none" stroke="#166534" stroke-width="5.5" stroke-linecap="round" />
  <path d="M150,305 Q130,250 112,195" fill="none" stroke="#22c55e" stroke-width="5" stroke-linecap="round" />

  <!-- Bird of Paradise Leaves (3D Shaded) -->
  <!-- Left Back Leaf -->
  <g>
    <path d="M112,195 Q85,160 92,110 Q135,145 112,195 Z" fill="url(#leafGradBack)" stroke="#064e3b" stroke-width="1.5" />
    <path d="M112,195 Q100,150 92,110" fill="none" stroke="#86efac" stroke-width="1.5" opacity="0.6" />
    <!-- Leaf Veins -->
    <path d="M106,170 Q92,160 86,155 M102,152 Q90,142 85,137 M98,135 Q88,126 84,120" stroke="#86efac" stroke-width="1" opacity="0.4" fill="none"/>
  </g>

  <!-- Right Leaf -->
  <g>
    <path d="M195,150 Q180,105 232,80 Q240,130 195,150 Z" fill="url(#leafGradMain)" stroke="#14532d" stroke-width="1.5" />
    <path d="M195,150 Q210,118 232,80" fill="none" stroke="#bbf7d0" stroke-width="2" opacity="0.7" />
    <!-- Veins -->
    <path d="M204,138 Q218,128 226,122 M212,122 Q224,112 230,106 M218,108 Q228,98 232,92" stroke="#bbf7d0" stroke-width="1" opacity="0.4" fill="none"/>
  </g>

  <!-- Center Front Large Leaf -->
  <g>
    <path d="M142,145 Q115,105 145,60 Q182,100 142,145 Z" fill="url(#leafGradMain)" stroke="#14532d" stroke-width="1.5" />
    <path d="M142,145 Q144,100 145,60" fill="none" stroke="#bbf7d0" stroke-width="2" opacity="0.8" />
    <!-- Veins left & right -->
    <path d="M143,125 Q130,115 124,110 M144,108 Q132,98 128,92 M144,90 Q135,82 130,76" stroke="#bbf7d0" stroke-width="1" opacity="0.5" fill="none"/>
    <path d="M143,128 Q156,118 162,112 M144,110 Q156,100 162,94 M144,92 Q154,84 158,78" stroke="#bbf7d0" stroke-width="1" opacity="0.5" fill="none"/>
  </g>
</svg>
