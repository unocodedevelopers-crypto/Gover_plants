<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 320" width="100%" height="100%">
  <defs>
    <!-- Broad, gentle arch path positioned comfortably down inside the canvas -->
    <path id="topArcPath" d="M 60,110 Q 325,30 590,110" fill="none" />
  </defs>

  <!-- Arched Top Text: DUBAI'S FAVOURITE GARDEN CENTRE in Green -->
  <text fill="#006837" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" letter-spacing="3">
    <textPath href="#topArcPath" startOffset="50%" text-anchor="middle">
      DUBAI'S FAVOURITE GARDEN CENTRE
    </textPath>
  </text>

  <!-- Main Cursive 'Gover' Wordmark in Green -->
  <text x="325" y="215" text-anchor="middle" fill="#006837" font-family="'Brush Script MT', 'Dancing Script', 'Segoe Script', cursive" font-size="140" font-weight="700">
    Gover
  </text>

  <!-- Leaf Accent icon over the 'e' in Green -->
  <g transform="translate(390, 115) rotate(-15) scale(1.1)">
    <path d="M 12,20 C -2,10 0,0 20,-5 C 22,12 18,18 12,20 Z" fill="#006837" />
    <path d="M 18,18 C 30,8 28,-3 48,-6 C 47,12 40,17 18,18 Z" fill="#006837" />
  </g>

  <!-- Subtitle: GARDEN CENTRE in Green -->
  <text x="325" y="270" text-anchor="middle" fill="#006837" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="32" font-weight="800" letter-spacing="8">
    GARDEN CENTRE
  </text>
</svg>
