<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="300" height="390">
  <style>
    .character { animation: bounce 1.1s ease-in-out infinite; transform-origin: 100px 165px; }
    .leftLeg { transform-origin: 85px 158px; animation: swingL 1.1s ease-in-out infinite; }
    .rightLeg { transform-origin: 115px 158px; animation: swingR 1.1s ease-in-out infinite; }
    .rightArm { transform-origin: 152px 118px; animation: wave 1.1s ease-in-out infinite; }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-14px); }
    }
    @keyframes swingL {
      0%, 100% { transform: rotate(10deg); }
      50% { transform: rotate(-10deg); }
    }
    @keyframes swingR {
      0%, 100% { transform: rotate(-10deg); }
      50% { transform: rotate(10deg); }
    }
    @keyframes wave {
      0%, 100% { transform: rotate(10deg); }
      50% { transform: rotate(-35deg); }
    }
  </style>

  <g class="character">
    <!-- legs -->
    <g class="leftLeg">
      <rect x="78" y="150" width="14" height="45" rx="7" fill="#006837"/>
      <ellipse cx="85" cy="200" rx="13" ry="7" fill="#ffffff"/>
    </g>
    <g class="rightLeg">
      <rect x="108" y="150" width="14" height="45" rx="7" fill="#006837"/>
      <ellipse cx="115" cy="200" rx="13" ry="7" fill="#ffffff"/>
    </g>

    <!-- left arm (static, resting) -->
    <g transform="rotate(-20 48 118)">
      <rect x="30" y="115" width="16" height="50" rx="8" fill="#006837"/>
      <circle cx="34" cy="160" r="10" fill="#ffffff"/>
    </g>

    <!-- body -->
    <circle cx="100" cy="110" r="55" fill="#006837"/>

    <!-- wing/hair accents (from original logo) -->
    <g transform="translate(58,60) scale(1.15)">
      <path d="M 12,20 C -2,10 0,0 20,-5 C 22,12 18,18 12,20 Z" fill="#ffffff" />
      <path d="M 18,18 C 30,8 28,-3 48,-6 C 47,12 40,17 18,18 Z" fill="#ffffff" />
    </g>

    <!-- face -->
    <circle cx="82" cy="95" r="7" fill="#ffffff"/>
    <circle cx="84" cy="96" r="3" fill="#1a1a1a"/>
    <circle cx="118" cy="95" r="7" fill="#ffffff"/>
    <circle cx="116" cy="96" r="3" fill="#1a1a1a"/>
    <path d="M 82,110 Q 100,122 118,110" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- G badge -->
    <circle cx="100" cy="140" r="16" fill="#ffffff"/>
    <text x="100" y="148" font-family="'Brush Script MT','Dancing Script',cursive" font-size="20" font-weight="bold" fill="#006837" text-anchor="middle">G</text>

    <!-- right arm (waving), drawn last so it's on top -->
    <g class="rightArm">
      <rect x="146" y="65" width="16" height="55" rx="8" fill="#006837"/>
      <circle cx="154" cy="68" r="10" fill="#ffffff"/>
    </g>
  </g>
</svg>
